[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bare-kit"
version = "0.1.0"
description = "Python bindings for Bare Kit"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Holepunch" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/holepunchto/bare-kit-python"
Repository = "https://github.com/holepunchto/bare-kit-python"
Issues = "https://github.com/holepunchto/bare-kit-python/issues"

[tool.hatch.build.targets.sdist]
exclude = ["src/bare_kit/prebuilds", "node_modules", "build"]

[tool.hatch.build.targets.wheel]
packages = ["src/bare_kit"]
exclude = ["src/bare_kit/prebuilds"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
]
